name: Release

# Deux façons de publier :
#   - Actions → Release → Run workflow : la prochaine version est calculée
#     d'après le dernier tag et les commits (feat → mineure, fix → corrective,
#     feat! → majeure ; scripts/next-version.sh), taguée sur main, puis publiée.
#     On peut forcer le type (patch, minor, major) ou donner une version exacte.
#   - pousser un tag : git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version (auto = d'après les commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Version exacte (facultatif, ex. v1.0.0) — prioritaire sur le type"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test -count=1 ./...
      - name: Créer le tag (déclenchement manuel)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(scripts/next-version.sh "$BUMP")
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version invalide : $VERSION (attendu vMAJEUR.MINEUR.CORRECTIF)" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Le tag $VERSION existe déjà" >&2
            exit 1
          fi
          echo "Publication de $VERSION"
          echo "### Publication de \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
